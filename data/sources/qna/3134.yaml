question: |
  VUG4 states:

  Different availability of Loaders. Drive Team Members may add Match Load Pins to the Loaders
  adjacent to their Alliance Station during the Autonomous Period and Driver Controlled Period of
  the Match.

  Does the specification of Pins imply that Cups may NOT be loaded during the Autonomous Period?
holding: |
  The intent of VUG4 is to allow the introduction of both types of Match Load Scoring Objects (Pins
  and Cups) during the specified periods of the Match. This wording will be corrected in the June 4
  game manual update.
notes: >
  The v1.1 manual text of <VUG4> ("Drive Team Members may introduce Match Load Scoring Objects
  into the Loaders adjacent to their Alliance Station during the Autonomous Period and Driver
  Controlled Period of the Match") already reflects this correction -- it says "Scoring Objects,"
  not "Pins." This ruling is recorded for provenance even though v1.1 already incorporates the fix,
  since it explains why the wording differs from earlier manual versions.
